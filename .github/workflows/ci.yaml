name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Every platform the package claims to support, so the claim is tested
    # rather than assumed. The tool shells out to git and touches the
    # filesystem, which is exactly where platforms differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # The skill is embedded in the binary so it can be installed without a
      # clone. Regenerate it and fail if the committed copy is behind.
      - name: Check the embedded skill is current
        run: |
          dart run tool/embed_skill.dart
          git diff --exit-code lib/src/skill.g.dart

      - name: Test
        run: dart test

      # The page's JavaScript lives inside a Dart raw string, so a syntax
      # error there compiles fine and breaks the whole UI at runtime. It has
      # happened; check it explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check the page script parses
        run: dart run tool/check_page_js.dart

      - name: Build
        run: dart compile exe bin/commitreview.dart -o commitreview
