name: commitreview
description: >-
  Review a commit in your browser and hand the comments to your AI coding agent
  over MCP, so it can answer them and commit the changes back.
version: 0.4.0
repository: https://github.com/Klutch-Software-Incorporated/commitreview
issue_tracker: https://github.com/Klutch-Software-Incorporated/commitreview/issues

environment:
  sdk: ^3.5.0

# No runtime dependencies: the whole tool is dart:io and dart:convert, so
# `dart compile exe` yields a standalone binary with nothing to install.
dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  commitreview:
